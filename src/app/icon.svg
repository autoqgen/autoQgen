<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <linearGradient id="spark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Square Container matching site branding -->
  <rect width="512" height="512" rx="128" fill="url(#brand-grad)" />

  <!-- Subtle inner border outline -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="10" />

  <!-- Stylized Document silhouette with folded corner -->
  <path d="M148 116 C148 102.745 158.745 92 172 92 H288 L364 168 V396 C364 409.255 353.255 420 340 420 H172 C158.745 420 148 409.255 148 396 V116 Z" fill="#ffffff" fill-opacity="0.12" />

  <!-- AQ Text Emblem -->
  <text x="256" y="328" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="210" letter-spacing="-6" filter="url(#glow)">AQ</text>

  <!-- Decorative Spark Icon in brand accent tone -->
  <circle cx="372" cy="140" r="32" fill="url(#spark-grad)" />
  <path d="M372 120 L377 135 L392 140 L377 145 L372 160 L367 145 L352 140 L367 135 Z" fill="#ffffff" />
</svg>